<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>StudyFlow Fetch Embed Boilerplate</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto auto 1fr;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f4f7ff;
        color: #0f172a;
      }

      .bar,
      .status {
        padding: 12px;
        border-bottom: 1px solid #dbe4f5;
        background: #fff;
      }

      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: end;
      }

      label {
        display: grid;
        gap: 4px;
        font-size: 12px;
        color: #475569;
      }

      input,
      select,
      button {
        font: inherit;
      }

      input,
      select {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 8px 10px;
      }

      button {
        border: 1px solid #0284c7;
        border-radius: 8px;
        background: #0ea5e9;
        color: #fff;
        padding: 9px 12px;
        cursor: pointer;
        font-weight: 600;
      }

      .status-row {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .progress {
        width: 260px;
        height: 8px;
        border-radius: 999px;
        background: #dbeafe;
        overflow: hidden;
      }

      .progress > div {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #0ea5e9, #0284c7);
        transition: width 180ms ease;
      }

      .log {
        margin-top: 8px;
        max-height: 90px;
        overflow: auto;
        font-family: Consolas, monospace;
        font-size: 12px;
        color: #334155;
      }

      iframe {
        width: 100%;
        height: calc(100vh - 180px);
        border: 0;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <label>
        StudyFlow Server Origin
        <input id="origin" type="text" value="https://your-studyflow-server.example.com" />
      </label>

      <label>
        Target Screen
        <select id="target">
          <option value="/">Home</option>
          <option value="/dashboard">Dashboard</option>
          <option value="/setup">Setup</option>
        </select>
      </label>

      <button id="load" type="button">Stream + Load</button>
    </div>

    <div class="status">
      <div class="status-row">
        <strong id="phase">Idle</strong>
        <span id="message">Not started</span>
        <div class="progress"><div id="progress-bar"></div></div>
      </div>
      <div id="log" class="log"></div>
    </div>

    <iframe id="studyflow-frame" title="StudyFlow"></iframe>

    <script>
      (function () {
        const originInput = document.getElementById("origin");
        const targetSelect = document.getElementById("target");
        const loadButton = document.getElementById("load");
        const phaseEl = document.getElementById("phase");
        const messageEl = document.getElementById("message");
        const progressBar = document.getElementById("progress-bar");
        const logEl = document.getElementById("log");
        const frame = document.getElementById("studyflow-frame");

        let eventSource = null;

        function normalizeOrigin(value) {
          return String(value || "").trim().replace(/\/+$/, "");
        }

        function addLog(text) {
          const row = document.createElement("div");
          row.textContent = "[" + new Date().toLocaleTimeString() + "] " + text;
          logEl.appendChild(row);
          logEl.scrollTop = logEl.scrollHeight;
        }

        function closeStream() {
          if (eventSource) {
            eventSource.close();
            eventSource = null;
          }
        }

        async function loadFinalHtml(renderUrl) {
          const response = await fetch(renderUrl, { method: "GET", mode: "cors" });
          if (!response.ok) {
            throw new Error("Render request failed (" + response.status + ")");
          }
          const html = await response.text();
          frame.srcdoc = html;
        }

        function startFlow() {
          closeStream();
          logEl.innerHTML = "";

          const origin = normalizeOrigin(originInput.value);
          const target = targetSelect.value || "/";
          const streamUrl = origin + "/api/html/stream?target=" + encodeURIComponent(target);

          phaseEl.textContent = "Initializing";
          messageEl.textContent = "Connecting...";
          progressBar.style.width = "2%";
          addLog("Connecting to stream");

          eventSource = new EventSource(streamUrl);

          eventSource.addEventListener("status", function (event) {
            const payload = JSON.parse(event.data);
            phaseEl.textContent = String(payload.phase || "status");
            messageEl.textContent = String(payload.message || "Working...");
            progressBar.style.width = String(Number(payload.progress || 0)) + "%";
            addLog(String(payload.message || "status"));
          });

          eventSource.addEventListener("complete", function (event) {
            const payload = JSON.parse(event.data);
            addLog("Fetching final HTML payload");
            loadFinalHtml(String(payload.renderUrl || ""))
              .then(function () {
                phaseEl.textContent = "Done";
                messageEl.textContent = "StudyFlow loaded";
                progressBar.style.width = "100%";
                addLog("Loaded successfully");
              })
              .catch(function (error) {
                phaseEl.textContent = "Error";
                messageEl.textContent = error instanceof Error ? error.message : String(error);
                addLog("Error: " + messageEl.textContent);
              })
              .finally(function () {
                closeStream();
              });
          });

          eventSource.addEventListener("fatal", function (event) {
            const payload = JSON.parse(event.data);
            phaseEl.textContent = "Error";
            messageEl.textContent = String(payload.message || "Initialization failed");
            addLog("Error: " + messageEl.textContent);
            closeStream();
          });

          eventSource.addEventListener("error", function () {
            phaseEl.textContent = "Error";
            messageEl.textContent = "Stream failed";
            addLog("Stream failed");
            closeStream();
          });
        }

        loadButton.addEventListener("click", startFlow);
      })();
    </script>
  </body>
</html>
