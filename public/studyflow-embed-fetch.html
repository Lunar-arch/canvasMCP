<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>StudyFlow Fetch Embed Boilerplate</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto auto 1fr;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f4f7ff;
        color: #0f172a;
      }

      .bar,
      .status {
        padding: 12px;
        border-bottom: 1px solid #dbe4f5;
        background: #fff;
      }

      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: end;
      }

      label {
        display: grid;
        gap: 4px;
        font-size: 12px;
        color: #475569;
      }

      input,
      select,
      button {
        font: inherit;
      }

      input,
      select {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 8px 10px;
      }

      button {
        border: 1px solid #0284c7;
        border-radius: 8px;
        background: #0ea5e9;
        color: #fff;
        padding: 9px 12px;
        cursor: pointer;
        font-weight: 600;
      }

      .status-row {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .progress {
        width: 260px;
        height: 8px;
        border-radius: 999px;
        background: #dbeafe;
        overflow: hidden;
      }

      .progress > div {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #0ea5e9, #0284c7);
        transition: width 180ms ease;
      }

      .log {
        margin-top: 8px;
        max-height: 90px;
        overflow: auto;
        font-family: Consolas, monospace;
        font-size: 12px;
        color: #334155;
      }

      iframe {
        width: 100%;
        height: calc(100vh - 180px);
        border: 0;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <label>
        StudyFlow Server Origin
        <input id="origin" type="text" value="https://your-studyflow-server.example.com" />
      </label>

      <label>
        Target Screen
        <select id="target">
          <option value="/">Home</option>
          <option value="/dashboard">Dashboard</option>
          <option value="/setup">Setup</option>
        </select>
      </label>

      <button id="load" type="button">Stream + Load</button>
    </div>

    <div class="status">
      <div class="status-row">
        <strong id="phase">Idle</strong>
        <span id="message">Not started</span>
        <div class="progress"><div id="progress-bar"></div></div>
      </div>
      <div id="log" class="log"></div>
    </div>

    <iframe id="studyflow-frame" title="StudyFlow"></iframe>

    <script>
      (function () {
        const originInput = document.getElementById("origin");
        const targetSelect = document.getElementById("target");
        const loadButton = document.getElementById("load");
        const phaseEl = document.getElementById("phase");
        const messageEl = document.getElementById("message");
        const progressBar = document.getElementById("progress-bar");
        const logEl = document.getElementById("log");
        const frame = document.getElementById("studyflow-frame");

        let eventSource = null;
        let streamFinished = false;

        function normalizeOrigin(value) {
          return String(value || "").trim().replace(/\/+$/, "");
        }

        function addLog(text) {
          const row = document.createElement("div");
          row.textContent = "[" + new Date().toLocaleTimeString() + "] " + text;
          logEl.appendChild(row);
          logEl.scrollTop = logEl.scrollHeight;
        }

        function closeStream() {
          if (eventSource) {
            eventSource.close();
            eventSource = null;
          }
        }

        function resolveFinalUrl(payload) {
          if (payload && typeof payload.appUrl === "string" && payload.appUrl) {
            return payload.appUrl;
          }

          if (payload && typeof payload.sourcePath === "string" && /^https?:\/\//i.test(payload.sourcePath)) {
            return payload.sourcePath;
          }

          if (payload && typeof payload.renderUrl === "string" && payload.renderUrl) {
            return payload.renderUrl;
          }

          return "";
        }

        function decodeBase64Utf8(base64Text) {
          const binary = atob(base64Text);
          const bytes = new Uint8Array(binary.length);

          for (let i = 0; i < binary.length; i += 1) {
            bytes[i] = binary.charCodeAt(i);
          }

          return new TextDecoder("utf-8").decode(bytes);
        }

        function loadFinalHtml(payload) {
          if (payload && typeof payload.htmlBase64 === "string" && payload.htmlBase64) {
            if (
              typeof payload.inlinedScriptCount === "number" ||
              typeof payload.inlinedStyleCount === "number"
            ) {
              addLog(
                "Inlined assets: " +
                  String(payload.inlinedScriptCount || 0) +
                  " scripts, " +
                  String(payload.inlinedStyleCount || 0) +
                  " styles"
              );
            }

            addLog("Rendering inline HTML payload in iframe");
            phaseEl.textContent = "Launching";
            messageEl.textContent = "Applying streamed HTML + JS payload...";
            progressBar.style.width = "98%";

            frame.addEventListener(
              "load",
              function () {
                phaseEl.textContent = "Done";
                messageEl.textContent = "StudyFlow loaded from streamed payload";
                progressBar.style.width = "100%";
                addLog("Frame load complete");
              },
              { once: true }
            );

            const htmlText = decodeBase64Utf8(payload.htmlBase64);
            frame.removeAttribute("src");
            frame.srcdoc = htmlText;
            return;
          }

          const finalUrl = resolveFinalUrl(payload);
          if (!finalUrl) {
            throw new Error("Missing htmlBase64 and final URL in complete event");
          }

          addLog("Inline payload missing, falling back to URL navigation");
          addLog("Navigating iframe to final app URL");
          phaseEl.textContent = "Launching";
          messageEl.textContent = "Waiting for app frame to load...";
          progressBar.style.width = "98%";

          frame.addEventListener(
            "load",
            function () {
              phaseEl.textContent = "Done";
              messageEl.textContent = "StudyFlow loaded";
              progressBar.style.width = "100%";
              addLog("Frame load complete");
            },
            { once: true }
          );

          frame.srcdoc = "";
          frame.src = finalUrl;
        }

        function startFlow() {
          closeStream();
          logEl.innerHTML = "";
          streamFinished = false;

          const origin = normalizeOrigin(originInput.value);
          const target = targetSelect.value || "/";
          const streamUrl =
            origin +
            "/api/html/stream?target=" +
            encodeURIComponent(target) +
            "&delivery=inline&inlineScripts=0";

          phaseEl.textContent = "Initializing";
          messageEl.textContent = "Connecting...";
          progressBar.style.width = "2%";
          addLog("Connecting to stream");

          eventSource = new EventSource(streamUrl);

          eventSource.addEventListener("status", function (event) {
            const payload = JSON.parse(event.data);
            phaseEl.textContent = String(payload.phase || "status");
            messageEl.textContent = String(payload.message || "Working...");
            progressBar.style.width = String(Number(payload.progress || 0)) + "%";
            addLog(String(payload.message || "status"));
          });

          eventSource.addEventListener("complete", function (event) {
            const payload = JSON.parse(event.data);
            streamFinished = true;
            addLog("Preparing final app navigation");
            try {
              loadFinalHtml(payload);
            } catch (error) {
              phaseEl.textContent = "Error";
              messageEl.textContent = error instanceof Error ? error.message : String(error);
              addLog("Error: " + messageEl.textContent);
            } finally {
              closeStream();
            }
          });

          eventSource.addEventListener("fatal", function (event) {
            const payload = JSON.parse(event.data);
            phaseEl.textContent = "Error";
            messageEl.textContent = String(payload.message || "Initialization failed");
            addLog("Error: " + messageEl.textContent);
            closeStream();
          });

          eventSource.addEventListener("error", function () {
            if (streamFinished) {
              return;
            }
            phaseEl.textContent = "Error";
            messageEl.textContent = "Stream failed";
            addLog("Stream failed");
            closeStream();
          });
        }

        loadButton.addEventListener("click", startFlow);
      })();
    </script>
  </body>
</html>
